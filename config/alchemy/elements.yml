# == In this configuration, you set up Alchemy's element layouts.
#
# For further information please see http://guides.alchemy-cms.com/elements.html

- name: article
  hint: true
  unique: true
  ingredients:
    - role: headline
      type: Headline
      default: :article_headline
      hint: true
    - role: picture
      type: Picture
      hint: true
      settings:
        size: 1200x600
    - role: text
      type: Richtext
      default: :article_text
      hint: true

- name: header_contact
  unique: true
  ingredients:
    - role: phone
      type: Text
      default: "(714) 857-0010"
    - role: email
      type: Text
      default: "sales@zevipromotion.com"

- name: carousel_slide
  ingredients:
    - role: subtitle
      type: Text
      default: "Polos, Workwear, T-Shirts, & More!"
    - role: title
      type: Text
      default: "Shop Apparel"
    - role: description
      type: Text
      default: "Premium embroidered apparel and printed sportswear designed to make your brand stand out."
    - role: image
      type: Picture
    - role: link
      type: Text
      default: "#"

- name: promo_card
  ingredients:
    - role: subtitle
      type: Text
    - role: title
      type: Text
    - role: image
      type: Picture
    - role: link
      type: Text
      default: "#"

- name: product_card
  ingredients:
    - role: section
      type: Select
      default: "New Products"
      settings:
        select_values: ["New Products", "Daily Deals", "Trending Products"]
    - role: category
      type: Text
    - role: title
      type: Text
    - role: badge
      type: Text
    - role: price
      type: Text
    - role: old_price
      type: Text
    - role: min_qty
      type: Text
    - role: image
      type: Picture
    - role: slug
      type: Text

- name: artwork_tips
  unique: true
  ingredients:
    - role: phone
      type: Text
      default: "(714) 857-0010"
    - role: email
      type: Text
      default: "sales@zevipromotion.com"
    - role: avatar
      type: Picture
    - role: designer_name
      type: Text
      default: "Libby"
    - role: designer_title
      type: Text
      default: "with Zevi Promotions"
    - role: designer_years
      type: Text
      default: "12 years of experience"
    - role: banner_title
      type: Text
      default: "Artwork Tips & Guidelines"
    - role: banner_description
      type: Text
      default: "Our dedicated creative team is always willing to work directly with you to make sure your custom artwork looks absolutely amazing on whatever item you choose. Explore this page to learn more about file specifications and how our processes work!"

